<!--
  index.html — myrograph, a gallery of gear-curve patterns: every ring/wheel/shape/pen-hole combination of the
  Deluxe set (rings 144/96 and 150/105, rack, 15 round wheels, Eye/Bar/Triangle/Cross).

  Role: this is the whole app (single static page, no build step, no server). The CORE section
  is pure math: it builds each piece's tooth outline, rolls one piece around/inside another with
  tooth-for-tooth contact (works for any closed outline, not just circles), and rejects pairs
  whose pieces would overlap. The UI section enumerates the valid combinations, lays them out in
  a virtualized grid, and for tiles on screen renders the curve with three.js into an offscreen
  WebGL canvas, copying the result into a plain 2D canvas inside the tile (so tiles scroll
  natively with their labels). Tiles that scroll away are discarded and redrawn on demand.

  Naming: the saved-file identifiers still say "spirograph" (PNG chunk SpirographGallery, album and
  share-link app id spirograph-gallery, localStorage keys spirograph.*) so files made earlier keep working.

  Usage: open index.html in a browser (needs network for the three.js CDN import map), or run
  `python3 -m http.server` in this directory and visit http://localhost:8000.
  Controls: filter chips with piece pictures (none selected = no filter), ink palette and paper
  color, Shuffle / Reset order. Ink: pick a preset palette (or one of your own) and Auto cycles
  through it per moving piece; newly added Compose layers take the palette's next unused color.
  Dark-background palettes (Neon, Midnight, Chalkboard, or your own with "Paper" ticked) also set the paper.
  "Edit…" / "+ New" build custom palettes, kept in localStorage (spirograph.palettes.v1). "Compose" opens a panel on the right and turns the grid into a picker:
  click patterns to add them as layers of one overlay (shared centre) with per-layer color,
  visibility, rotation and size, and a Base scale switch (True size / Fit each). "Save PNG"
  exports the overlay as an image with the whole layer setup embedded in an iTXt chunk
  ("SpirographGallery", JSON); "Open…" (or dropping such a PNG on the page) restores the layers so
  they can be adjusted again. Layers are stored by part ids (ring/wheel/hole), not grid indices.
  The top-level Albums view (next to Patterns) keeps named collections of those same small
  setups in the browser's localStorage (per site/origin; thumbnails are re-rendered from the
  setup, never stored) and exports/imports them as .spiroalbum.json files (importing a saved
  PNG adds it to the album). Opening an album item loads it into the Compose panel.
  Share links: "Copy link" (panel) / the link button on an album item puts the overlay into the
  URL fragment (#v1/paper/scale/layer/layer..., ~35 chars per layer, never sent to a server);
  opening such a URL restores the overlay in the Compose panel. A file:// link only works on
  the machine that has the file, so host the page (e.g. GitHub Pages) to share with others. Combos whose pieces would physically collide while rolling (found by
  simulation) are hidden unless "Include overlapping combos" is on.

  Edit PARTS to change tooth counts, shapes or hole layouts. Tooth and hole counts follow the
  published charts and the user's photo of the set; shaped-wheel sizes and hole positions were
  measured by eye from that photo (about +/-0.5 tooth), and round-wheel hole distances are an
  even spread over the range seen in the photo (a round wheel's pattern depends only on the
  pen's distance from the centre, not its angle).
  The CORE block between the BEGIN/END markers is extracted and tested under node.
-->

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

// ======================================================= BEGIN CORE (pure math)
// Units: one tooth of arc length = 1. A piece with N teeth has an outline of perimeter N.
const TAU = Math.PI * 2;
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const lcm = (a, b) => a / gcd(a, b) * b;
const PER_TOOTH = 4;                          // outline samples per tooth

// What's in the box. Round wheels are named by tooth count; shapes by name with an estimated size.
const PARTS = {
  rings: [{ outer: 144, inner: 96 }, { outer: 150, inner: 105 }],
  rack: { N: 150, aspect: 7.8 },              // long stadium shape; teeth on the outside only
  wheels: [24, 30, 32, 40, 42, 45, 48, 52, 56, 60, 63, 72, 75, 80, 84],
  // Shaped wheels: N = teeth the piece meshes with; holes = [x, y] in tooth units from the piece
  // centre (y up), numbered in order. The Cross's arm ends lie on a circle, so it rolls like a
  // 60-tooth wheel (pitch circle) while its real silhouette is used for collision and pictures.
  shapes: [
    { key: 'eye', name: 'Eye', N: 60, holes: [[-8.5, .6], [-6.3, .6], [-4.3, .6], [-2.4, .6], [-.9, .6],
      [-.2, -2.5], [1.7, -2.4], [3.5, -1.8], [5.5, -.8], [7.5, -1.1], [.3, -4.3], [3.1, -3.9], [5.3, -2.9]] },
    { key: 'bar', name: 'Bar', N: 42, holes: [[0, 4.9], [0, 3], [0, 1.2], [-2.8, -1], [-2.8, -2.8], [-2.8, -4.7],
      [2.8, -1], [2.8, -2.8], [2.8, -4.7]] },
    { key: 'triangle', name: 'Triangle', N: 53, holes: [[-.15, 7.9], [-2, 6.5], [1.7, 6.5], [-2.2, 4.4], [-.15, 4.2],
      [1.7, 4.4], [-2.2, -1.8], [-.15, -1.8], [1.7, -1.8], [-2.6, -3.75], [-.15, -3.75], [1.9, -3.75]] },
    { key: 'cross', name: 'Cross', N: 60, holes: [[0, 8.1], [0, 5.9], [0, 3.9], [0, 2.2],
      [-8.5, -1.7], [-6.3, -1.7], [-4.4, -1.7], [4.4, -1.7], [6.3, -1.7], [7.9, -1.7]] },
  ],
};

// ---- outlines: closed CCW curves resampled to exactly N*PER_TOOTH points, centred on the origin
function makeOutline(dense, N) {
  let pts = dense, area = 0;
  for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; area += a[0] * b[1] - b[0] * a[1]; }
  if (area < 0) pts = pts.slice().reverse();
  const n = pts.length, cum = new Float64Array(n + 1);
  for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; cum[i + 1] = cum[i] + Math.hypot(b[0] - a[0], b[1] - a[1]); }
  const total = cum[n], scale = N / total, M = N * PER_TOOTH, p = new Float64Array(2 * M);
  let j = 0, cx = 0, cy = 0;
  for (let k = 0; k < M; k++) {
    const target = total * k / M;
    while (cum[j + 1] < target) j++;
    const a = pts[j], b = pts[(j + 1) % n], t = (target - cum[j]) / (cum[j + 1] - cum[j] || 1);
    p[2 * k] = (a[0] + (b[0] - a[0]) * t) * scale; p[2 * k + 1] = (a[1] + (b[1] - a[1]) * t) * scale;
    cx += p[2 * k]; cy += p[2 * k + 1];
  }
  cx /= M; cy /= M;
  for (let k = 0; k < M; k++) { p[2 * k] -= cx; p[2 * k + 1] -= cy; }
  const t = new Float64Array(2 * M);
  for (let k = 0; k < M; k++) {
    const a = (k + M - 1) % M, b = (k + 1) % M;
    const dx = p[2 * b] - p[2 * a], dy = p[2 * b + 1] - p[2 * a + 1], l = Math.hypot(dx, dy);
    t[2 * k] = dx / l; t[2 * k + 1] = dy / l;
  }
  return { N, M, p, t };
}
const circleDense = () => Array.from({ length: 720 }, (_, i) => [Math.cos(TAU * i / 720), Math.sin(TAU * i / 720)]);
function stadiumDense(aspect) {                // length : width = aspect : 1
  const c = (aspect - 1) / 2, pts = [];
  for (let i = 0; i <= 48; i++) { const a = -Math.PI / 2 + Math.PI * i / 48; pts.push([c + 0.5 * Math.cos(a), 0.5 * Math.sin(a)]); }
  for (let i = 0; i <= 48; i++) { const a = Math.PI / 2 + Math.PI * i / 48; pts.push([-c + 0.5 * Math.cos(a), 0.5 * Math.sin(a)]); }
  return pts;
}
function smoothClosed(pts, passes) {           // round off corners slightly
  for (let it = 0; it < passes; it++)
    pts = pts.map((c, i) => { const a = pts[(i + pts.length - 1) % pts.length], b = pts[(i + 1) % pts.length];
      return [.25 * a[0] + .5 * c[0] + .25 * b[0], .25 * a[1] + .5 * c[1] + .25 * b[1]]; });
  return pts;
}
function roundedRectDense(w, h, r) {           // the Bar
  const pts = [];
  for (const [cx, cy, a0] of [[w / 2 - r, -h / 2 + r, -90], [w / 2 - r, h / 2 - r, 0], [-w / 2 + r, h / 2 - r, 90], [-w / 2 + r, -h / 2 + r, 180]])
    for (let i = 0; i <= 12; i++) { const a = (a0 + 90 * i / 12) * Math.PI / 180; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  return pts;
}
function lensDense(len, thick) {               // the Eye: two circular arcs, tips on the x axis
  const a = len / 2, b = thick / 2, rho = (a * a + b * b) / (2 * b), cy = rho - b, up = [];
  for (let i = 0; i <= 120; i++) { const x = -a * Math.cos(Math.PI * i / 120); up.push([x, -cy + Math.sqrt(rho * rho - x * x)]); }
  return smoothClosed(up.concat(up.slice(1, -1).reverse().map(([x, y]) => [x, -y])), 6);
}
function reuleauxDense(w) {                    // the Triangle: constant-width rounded triangle, vertex up
  const V = [0, 1, 2].map(i => [w / Math.sqrt(3) * Math.cos(Math.PI / 2 + TAU * i / 3), w / Math.sqrt(3) * Math.sin(Math.PI / 2 + TAU * i / 3)]);
  const pts = [];
  for (let i = 0; i < 3; i++) {
    const c = V[(i + 2) % 3], a0 = Math.atan2(V[i][1] - c[1], V[i][0] - c[0]);
    let da = Math.atan2(V[(i + 1) % 3][1] - c[1], V[(i + 1) % 3][0] - c[0]) - a0; da -= TAU * Math.round(da / TAU);
    for (let k = 0; k < 60; k++) pts.push([c[0] + w * Math.cos(a0 + da * k / 60), c[1] + w * Math.sin(a0 + da * k / 60)]);
  }
  return smoothClosed(pts, 6);
}
const perimeter = pts => pts.reduce((t, p, i) => t + Math.hypot(p[0] - pts[(i + 1) % pts.length][0], p[1] - pts[(i + 1) % pts.length][1]), 0);
function crossBodyDense() {                    // real silhouette: curved arm ends, big concave notches
  const Rt = 9.55, hw = 2.75, rho = 5, yf = hw + rho, yc = Math.sqrt(Rt * Rt - hw * hw), al = Math.asin(hw / Rt), q = [];
  q.push([hw, yf], [hw, (yf + yc) / 2]);
  for (let i = 0; i <= 16; i++) { const a = Math.PI / 2 - al + 2 * al * i / 16; q.push([Rt * Math.cos(a), Rt * Math.sin(a)]); }
  q.push([-hw, (yf + yc) / 2]);
  for (let i = 0; i < 16; i++) { const t = -Math.PI / 2 * i / 16; q.push([-hw - rho + rho * Math.cos(t), yf + rho * Math.sin(t)]); }
  const out = [];
  for (let k = 0; k < 4; k++) { const c = Math.cos(k * Math.PI / 2), sn = Math.sin(k * Math.PI / 2); for (const [x, y] of q) out.push([x * c - y * sn, x * sn + y * c]); }
  return out;
}

// Pen holes in a piece's local frame (same units as the outline).
function wheelHoles(N) {                       // 5 holes on the 24 up to 35 on the 84, rim to centre
  const n = Math.round(N / 2 - 7), tip = N / TAU + 0.5, d0 = 0.8 * tip, d1 = 0.14 * tip;   // as seen in the photo
  return Array.from({ length: n }, (_, k) => [d0 + (d1 - d0) * k / (n - 1), 0]);
}

// ---- rolling
const _f = [0, 0, 0, 0], _g = [0, 0, 0, 0];
function sample(o, s, out) {                   // position + tangent at arc length s
  let q = (s * PER_TOOTH) % o.M; if (q < 0) q += o.M;
  const i = Math.floor(q), f = q - i, j = (i + 1) % o.M, p = o.p, t = o.t;

function buildCatalog() {

  const rollers = PARTS.wheels.map(roundWheel);

    tracks.push({ id: `ring${r.outer}-out`, name: `Ring ${r.outer} outer`, kind: 'ring', inside: false, which: 'outer', ratio: r.inner / r.outer, o: makeOutline(circleDense(), r.outer), body: makeOutline(circleDense(), r.outer) });
  }

  for (const w of rollers) tracks.push({ id: 'fix-' + w.id, name: w.name, kind: 'piece', pieceId: w.id, inside: false, o: w.o, body: w.body, round: w.round });

    let n = 0, items = 0;
    for (const src of data.albums) {
      const base = String(src.name || 'Imported'); let name = base;
      for (let k = 2; albums.some(a => a.name === name); k++) name = `${base} (${k})`;
      const its = (src.items || []).filter(i => validState(i.state)).map(i => ({ id: uid(), name: String(i.name || 'Overlay'), created: i.created || Date.now(), state: i.state }));
      albums.push({ id: uid(), name, items: its }); curId = albums[albums.length - 1].id; n++; items += its.length;
    }
    persist(); buildAlbums(); say(`Imported ${n} album${n === 1 ? '' : 's'}, ${items} overlay${items === 1 ? '' : 's'}`);
  } catch (err) { say(err.message, 6000); }
}
$('v-p').onclick = () => setView('patterns'); $('v-a').onclick = () => setView('albums');
$('ov-album').onclick = saveToAlbum;
$('al-sel').onchange = e => { curId = e.target.value; persist(); buildAlbums(); };
const newAlbum = () => { const n = prompt('New album name', `Album ${albums.length + 1}`); if (n && n.trim()) { const a = { id: uid(), name: n.trim(), items: [] }; albums.push(a); curId = a.id; persist(); } buildAlbums(); };
$('al-new').onclick = newAlbum;
$('ov-albumsel').onchange = e => { if (e.target.value === '__new') return newAlbum(); if (e.target.value) { curId = e.target.value; persist(); } buildAlbums(); };
$('al-ren').onclick = () => { const a = curAlbum(), n = a && prompt('Album name', a.name); if (n && n.trim()) { a.name = n.trim(); persist(); buildAlbums(); } };
$('al-del').onclick = () => { const a = curAlbum(); if (a && confirm(`Delete album “${a.name}” and its ${a.items.length} overlay(s)? Export it first if you want a copy.`)) { albums = albums.filter(x => x !== a); curId = albums[0]?.id; persist(); buildAlbums(); } };
$('al-exp').onclick = () => exportAlbums(false); $('al-expall').onclick = () => exportAlbums(true);
$('al-imp').onclick = () => $('al-file').click();
$('al-file').onchange = e => { if (e.target.files[0]) importFile(e.target.files[0]); e.target.value = ''; };
window.addEventListener('storage', e => { if (e.key === STORE_KEY) { albums = loadAlbums(); thumbs.clear(); view === 'albums' ? buildAlbums() : fillAlbumSelects(); } });
fillAlbumSelects();

// ---- share links
async function copyLink(state) {
  if (!state.layers.length) return say('Add at least one layer first.');
  const url = location.href.split('#')[0] + '#' + encodeShare(state);
  try { await navigator.clipboard.writeText(url); say(`Link copied (${url.length} characters)` + (location.protocol === 'file:' ? ' - note: a file:// link only works on this computer' : '') + (url.length > 2000 ? ' - long; some apps truncate links' : ''), 7000); }
  catch { prompt('Copy this link:', url); }
}
function applyHash() {
  if (!location.hash.startsWith('#v1/')) return;
  try { applyState(decodeShare(location.hash)); } catch (err) { say(err.message, 8000); if (!composeOpen) setCompose(true); }
}
$('ov-link').onclick = () => copyLink(overlayState());
window.addEventListener('hashchange', () => {
  if (!location.hash.startsWith('#v1/')) return;
  if (layers.size && !confirm('Open the shared overlay and replace the current one?')) return;
  applyHash();
});
window.__spiro = { makePng, applyState, openFile, overlayState, layers, albumPayload, importFile, getAlbums: () => albums };   // test hook
function markTile(e) {                          // selection outline + badge on a grid tile
  const l = layers.get(list[e.i].key);
  e.el.classList.toggle('sel', !!l);
  if (l) e.el.style.setProperty('--lc', l.color);
}
const markTiles = () => { for (const e of tiles.values()) markTile(e); };

function toggleLayer(p) {
  if (layers.has(p.key)) { layers.delete(p.key); ovCache.get(p.key)?.geo.dispose(); ovCache.delete(p.key); }
  else {
    const used = new Set([...layers.values()].map(l => l.color));
    const cols = palette().colors, color = cols.find(c => !used.has(c)) || cols[layers.size % cols.length];
    layers.set(p.key, { key: p.key, p, color, visible: true, rot: 0, size: 100 });
  }
  markTiles(); buildLayerList(); renderOverlay();
}
function buildLayerList() {
  $('compose-btn').textContent = `Compose (${layers.size})`;
  $('ov-hint').style.display = layers.size ? 'none' : '';
  const box = $('layers'); box.innerHTML = '';
  for (const l of layers.values()) {
    const row = document.createElement('div'); row.className = 'layer' + (l.visible ? '' : ' off');
    row.innerHTML = `<input type="checkbox" title="Show / hide this layer" ${l.visible ? 'checked' : ''}>` +
      `<input type="color" value="${l.color}" title="Layer color"><span style="display:flex">${trackIcon(l.p.track)}${rollerIcon(l.p.roller, l.p.hole)}</span>` +
      `<span class="ltxt"><b>${l.p.track.name}</b> · ${l.p.track.inside ? 'inside' : 'outside'}<br>${l.p.roller.name} · hole ${l.p.hole}</span>` +
      `<button title="Remove">✕</button>` +
      `<label class="rot">Rotate <input type="range" data-k="rot" min="0" max="359" value="${l.rot}"><span>${l.rot}°</span></label>` +
      `<label class="rot">Size <input type="range" data-k="size" min="25" max="200" value="${l.size}"><span>${l.size}%</span></label>`;
    const vis = row.querySelector('input[type=checkbox]'), col = row.querySelector('input[type=color]'),
      del = row.querySelector('button');
    vis.onchange = () => { l.visible = vis.checked; row.classList.toggle('off', !l.visible); renderOverlay(); };
    col.oninput = () => { l.color = col.value; markTiles(); renderOverlay(); };
    for (const r of row.querySelectorAll('input[type=range]'))
      r.oninput = () => { l[r.dataset.k] = +r.value; r.nextElementSibling.textContent = r.value + (r.dataset.k === 'rot' ? '°' : '%'); renderOverlay(); };
    del.onclick = () => toggleLayer(l.p);
    box.append(row);
  }
}
function setCompose(open) {
  composeOpen = open;
  document.body.classList.toggle('compose-open', open);
  $('compose-btn').classList.toggle('on', open);
  relayout(); renderOverlay();
}
$('compose-btn').onclick = () => setCompose(!composeOpen);
$('ov-close').onclick = () => setCompose(false);
$('ov-clear').onclick = () => { for (const l of [...layers.values()]) toggleLayer(l.p); };
$('ov-scale').onchange = renderOverlay;
window.addEventListener('keydown', e => { if (e.key === 'Escape' && composeOpen) setCompose(false); });
new ResizeObserver(renderOverlay).observe(ovCanvas);

// ---------------------------------------------------------------- start
setTimeout(() => {                              // let "Preparing…" paint before the heavy enumeration
  const t0 = performance.now();
  CAT = buildCatalog(); ALL = CAT.combos; ALL.forEach((p, i) => { p.key = i; }); okCount = ALL.filter(p => p.ok).length;
  console.log(`catalog: ${okCount} of ${ALL.length} patterns fit, ${Math.round(performance.now() - t0)} ms`);
  buildFilters(); refilter(); applyHash();
}, 30);
</script>
