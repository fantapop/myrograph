<!--
  index.html — myrograph, a gallery of gear-curve patterns: every ring/wheel/shape/pen-hole combination of the
  Deluxe set (rings 144/96 and 150/105, rack, 15 round wheels, Eye/Bar/Triangle/Cross).

  Role: this is the whole app (single static page, no build step, no server). The CORE section
  is pure math: it builds each piece's tooth outline, rolls one piece around/inside another with
  tooth-for-tooth contact (works for any closed outline, not just circles), and rejects pairs
  whose pieces would overlap. The UI section enumerates the valid combinations, lays them out in
  a virtualized grid, and for tiles on screen renders the curve with three.js into an offscreen
  WebGL canvas, copying the result into a plain 2D canvas inside the tile (so tiles scroll
  natively with their labels). Tiles that scroll away are discarded and redrawn on demand.

  Naming: the saved-file identifiers still say "spirograph" (PNG chunk SpirographGallery, album and
  share-link app id spirograph-gallery, localStorage keys spirograph.*) so files made earlier keep working.

  Usage: open index.html in a browser (needs network for the three.js CDN import map), or run
  `python3 -m http.server` in this directory and visit http://localhost:8000.
  Controls: filter chips with piece pictures (none selected = no filter), ink palette and paper
  color, Shuffle / Reset order. Ink: pick a preset palette (or one of your own) and Auto cycles
  through it per moving piece; newly added Compose layers take the palette's next unused color.
  Dark-background palettes (Neon, Midnight, Chalkboard, or your own with "Paper" ticked) also set the paper.
  "Edit…" / "+ New" build custom palettes, kept in localStorage (spirograph.palettes.v1). "Compose" opens a panel on the right and turns the grid into a picker:
  click patterns to add them as layers of one overlay (shared centre) with per-layer color,
  visibility, rotation and size, and a Base scale switch (True size / Fit each). "Save PNG"
  exports the overlay as an image with the whole layer setup embedded in an iTXt chunk
  ("SpirographGallery", JSON); "Open…" (or dropping such a PNG on the page) restores the layers so
  they can be adjusted again. Layers are stored by part ids (ring/wheel/hole), not grid indices.
  The top-level Albums view (next to Patterns) keeps named collections of those same small
  setups in the browser's localStorage (per site/origin; thumbnails are re-rendered from the
  setup, never stored) and exports/imports them as .spiroalbum.json files (importing a saved
  PNG adds it to the album). Opening an album item loads it into the Compose panel.
  Share links: "Copy link" (panel) / the link button on an album item puts the overlay into the
  URL fragment (#v1/paper/scale/layer/layer..., ~35 chars per layer, never sent to a server);
  opening such a URL restores the overlay in the Compose panel. A file:// link only works on
  the machine that has the file (same for localhost); the page is hosted at https://fantapop.github.io/myrograph/ (GitHub Pages, from main), so copy links there to share. Combos whose pieces would physically collide while rolling (found by
  simulation) are hidden unless "Include overlapping combos" is on.

  Custom parts: the Custom parts filter row ("＋ Make a part…") opens a dialog to design your own shaped
  wheel: drag radial handles (with k-fold symmetry / mirror) or start from a preset, set its size in teeth
  (the edge is scaled to exactly that many teeth, so it meshes at the real tooth pitch), place pen holes
  (kept inside the edge), and see live which pieces of the set it fits with (green/red, from the same
  collision simulation as the catalog) plus an animated roll preview. Parts are saved in localStorage
  (spirograph.parts.v1, max 12), appear only behind their own filter (never in the main grid), and are
  identified by a hash of their definition, so PNGs, albums and share links carry the definition: anyone
  opening them can draw the part, and "keep part" in the layer list adds it to their library.
  Edit PARTS to change tooth counts, shapes or hole layouts. Tooth and hole counts follow the
  published charts and the user's photo of the set; shaped-wheel sizes and hole positions were
  measured by eye from that photo (about +/-0.5 tooth), and round-wheel hole distances are an
  even spread over the range seen in the photo (a round wheel's pattern depends only on the
  pen's distance from the centre, not its angle).
  The CORE block between the BEGIN/END markers is extracted and tested under node.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>myrograph</title>
<style>
  :root { --bg: #1b1b1f; --panel: #26262c; --ink: #e8e6e1; --dim: #8d8b86; --accent: #e9b44c; --paper: #faf7f0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid #000;
    padding: 8px 16px; max-height: 50vh; overflow: auto; }
  summary { cursor: pointer; color: var(--dim); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 6px; }
  .row > .label { color: var(--dim); width: 92px; flex: none; text-transform: uppercase;
    font-size: 11px; letter-spacing: .05em; }
  .row > .chips { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; min-width: 0; }
  .chip, button { font: inherit; color: var(--ink); background: #33333b; border: 1px solid #44444e;
    border-radius: 999px; padding: 1px 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .chip.pic { border-radius: 8px; padding: 3px 7px 3px 4px; }
  .chip svg { width: 28px; height: 28px; flex: none; }
  .chip.on { background: var(--accent); color: #1b1b1f; border-color: var(--accent); }
  button { border-radius: 4px; padding: 3px 10px; }
  .swatch { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 2px solid #44444e; }
  .swatch.on { border-color: #fff; }
  input[type=color] { width: 28px; height: 24px; padding: 0; border: 1px solid #44444e; background: none; cursor: pointer; }
  #count { margin-left: auto; color: var(--dim); }
  #f-ink { align-items: center; }
  #f-ink select, #pal-edit input[type=text] { font: inherit; color: var(--ink); background: #33333b; border: 1px solid #44444e; border-radius: 4px; padding: 2px 6px; }
  #pal-edit { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0 2px; padding: 8px 10px; background: #1f1f24; border-radius: 6px; }
  #pal-edit .pc, #pal-edit .pp { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; color: var(--dim); }
  #pal-edit .pp input[type=color]:disabled { opacity: .35; }
  #pal-edit .pc button { padding: 0 5px; margin-left: 1px; border-radius: 4px; background: none; border: none; color: var(--dim); }
  #pal-edit button:disabled { opacity: .35; cursor: default; }
  .cp { display: inline-flex; align-items: center; }
  .cp .chip { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .cp .edit { border-radius: 0 8px 8px 0; padding: 3px 7px; align-self: stretch; border-left: none; color: var(--dim); }
  dialog#pm { background: var(--panel); color: var(--ink); border: 1px solid #000; border-radius: 8px; padding: 0; width: min(1060px, 96vw); max-height: 94vh; overflow: auto; }
  dialog#pm::backdrop { background: rgba(0,0,0,.65); }
  .pm-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; border-bottom: 1px solid #000; position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .pm-head .sp { flex: 1; }
  .pm-head input[type=text], #pm select, #pm input[type=number] { font: inherit; color: var(--ink); background: #33333b; border: 1px solid #44444e; border-radius: 4px; padding: 2px 6px; }
  .pm-head label { color: var(--dim); display: inline-flex; align-items: center; gap: 6px; }
  .pm-head output { color: var(--ink); min-width: 2.2em; text-align: right; }
  #pm button.primary { background: var(--accent); color: #1b1b1f; border-color: var(--accent); font-weight: 600; }
  .pm-body { display: flex; flex-wrap: wrap; gap: 16px; padding: 14px; }
  .pm-left { flex: 1 1 400px; max-width: 520px; min-width: 280px; }
  .pm-right { flex: 1 1 360px; min-width: 280px; display: flex; flex-direction: column; gap: 12px; }
  .pm-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .pm-tabs button.on { background: var(--accent); color: #1b1b1f; border-color: var(--accent); }
  #pm-c:focus { outline: none; }
  #pm-c { display: block; width: 100%; aspect-ratio: 1; background: #1f1f24; border-radius: 6px; touch-action: none; cursor: crosshair; }
  #pm-v { display: block; width: 100%; max-width: 340px; aspect-ratio: 1; background: var(--paper); border-radius: 6px; }
  .pm-sec { background: #1f1f24; border-radius: 6px; padding: 8px 10px; }
  .pm-sec h4 { margin: 0 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
  .pm-sec .ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 6px; color: var(--dim); }
  .pm-sec .ctl label { display: inline-flex; align-items: center; gap: 5px; }
  #pm-hint, #pm-msg, #pm-sum { font-size: 11px; color: var(--dim); margin-top: 6px; min-height: 1.4em; }
  #pm-msg { color: var(--accent); }
  #pm-compat { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0 8px; }
  #pm-compat .grp { width: 100%; font-size: 11px; color: var(--dim); margin-top: 2px; }
  #pm-compat button { padding: 1px; border-radius: 6px; border: 2px solid #44444e; background: #2b2b32; line-height: 0; }
  #pm-compat button svg { width: 26px; height: 26px; color: var(--dim); }
  #pm-compat button.ok { border-color: #3f9b62; } #pm-compat button.bad { border-color: #c4553a; opacity: .75; } #pm-compat button.wait { border-style: dotted; }
  #pm-compat button.on { background: #44444e; outline: 2px solid var(--accent); }
  .layer .keep { padding: 0 6px; font-size: 11px; margin-top: 2px; }
  :root { --panel-w: min(440px, 92vw); }
  #compose-btn { position: absolute; right: 16px; top: 6px; }
  #grid { position: relative; margin: 16px; }
  body.compose-open header { margin-right: var(--panel-w); }
  body.compose-open #grid { margin-right: calc(16px + var(--panel-w)); }
  body.compose-open .tile { cursor: pointer; }
  .tile { position: absolute; background: var(--panel); border-radius: 6px; overflow: hidden; --lc: var(--accent); }
  body.compose-open .tile:hover { outline: 2px solid #55555f; }
  .tile.sel { outline: 3px solid var(--lc) !important; }
  .tile.sel::after { content: "✓"; position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--lc); color: #fff; text-align: center; line-height: 22px; font-weight: 700; text-shadow: 0 0 2px #000; }
  #compose { position: fixed; top: 0; right: 0; bottom: 0; width: var(--panel-w); z-index: 4; background: var(--panel);
    border-left: 1px solid #000; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .2s; }
  body.compose-open #compose { transform: none; }
  #compose .ch { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #000; }
  #compose .ch .sp { flex: 1; }
  #ovc { display: block; width: 100%; aspect-ratio: 1; background: var(--paper); flex: none; }
  [hidden] { display: none !important; }
  .pane { flex: 1; overflow: auto; min-height: 0; }
  #layers { padding: 4px 12px 0; }
  #views { display: flex; gap: 4px; margin-bottom: 4px; }
  #views button { border-radius: 6px; padding: 3px 14px; font-weight: 600; }
  #views button.on { background: var(--accent); color: #1b1b1f; border-color: var(--accent); }
  #albumview { margin: 16px; }
  body.compose-open #albumview { margin-right: calc(16px + var(--panel-w)); }
  body.view-albums #grid, body.view-albums header details { display: none; }
  .ab { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .ab .sp { flex: 1; }
  .ab select { max-width: 40%; font-size: 14px; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; padding-top: 14px; }
  .card { background: #1f1f24; border-radius: 6px; overflow: hidden; }
  .card canvas { display: block; width: 100%; aspect-ratio: 1; background: var(--paper); cursor: pointer; }
  .card .nm { display: flex; align-items: center; gap: 2px; padding: 5px 6px 2px 8px; font-size: 13px; }
  .card .nm span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .meta { padding: 0 8px 7px; font-size: 11px; color: var(--dim); }
  .card .nm button { padding: 0 5px; border-radius: 4px; background: none; border: none; color: var(--dim); }
  .card .nm button:hover { color: var(--ink); }
  .layer { padding: 8px 0; border-bottom: 1px solid #33333b; display: grid; grid-template-columns: auto auto auto 1fr auto; gap: 6px 8px; align-items: center; }
  .layer.off { opacity: .5; }
  .layer svg { width: 26px; height: 26px; color: var(--dim); }
  .layer .ltxt { font-size: 11px; line-height: 1.25; min-width: 0; }
  .layer .rot { grid-column: 2 / 6; width: 100%; display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 11px; }
  .layer .rot input { flex: 1; }
  .hint { color: var(--dim); padding: 12px; margin: 0; }
  #compose .tb { border-top: 1px solid #000; }
  #ov-msg { padding: 4px 12px; font-size: 11px; color: var(--accent); min-height: 1px; }
  body.dragging::after { content: "Drop a saved myrograph PNG to open it"; position: fixed; inset: 0; z-index: 9; display: grid;
    place-items: center; background: rgba(0,0,0,.7); font-size: 20px; }
  .tile canvas { display: block; width: 100%; aspect-ratio: 1; background: var(--paper); }
  .foot { height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 11px; line-height: 1.25; }
  .foot svg { width: 30px; height: 30px; flex: none; color: var(--dim); }
  .foot .txt { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot .txt b { font-weight: 600; }
</style>
</head>
<body>
<header>
  <nav id="views"><button id="v-p" class="on">Patterns</button><button id="v-a">Albums</button></nav>
  <button id="compose-btn">Compose (0)</button>
  <details open>
    <summary>Filters</summary>
    <div class="row"><span class="label">Rolling</span><span class="chips" id="f-mode"></span></div>
    <div class="row"><span class="label">Fixed part</span><span class="chips" id="f-fixed"></span></div>
    <div class="row"><span class="label">Moving piece</span><span class="chips" id="f-roller"></span></div>
    <div class="row"><span class="label">Pen hole</span><span class="chips" id="f-hole"></span></div>
    <div class="row"><span class="label">Custom parts</span><span class="chips" id="f-custom"></span></div>
    <div class="row"><span class="label">Ink</span><span class="chips" id="f-ink"></span></div>
    <div id="pal-edit" hidden></div>
    <div class="row"><span class="label">Paper</span>
      <input type="color" id="paper" value="#faf7f0">
      <button id="shuffle" style="margin-left:12px">Shuffle</button><button id="reset">Reset order</button>
      <span id="count">Preparing…</span></div>
  </details>
</header>
<div id="grid"></div>
<section id="albumview" hidden>
  <div class="ab"><select id="al-sel" title="Album"></select>
    <button id="al-new">New album</button><button id="al-ren">Rename</button><button id="al-del">Delete</button><span class="sp"></span>
    <button id="al-exp" title="Download this album as a file">Export</button><button id="al-expall" title="Download every album">Export all</button>
    <button id="al-imp" title="Import an album file (.json) or a saved PNG">Import…</button>
    <input type="file" id="al-file" accept=".json,application/json,image/png" hidden></div>
  <div id="al-items" class="thumbs"></div>
</section>
<aside id="compose">
  <div class="ch"><b>Overlay</b><span class="sp"></span>
    <label style="color:var(--dim)">Base scale</label>
    <select id="ov-scale" title="True size keeps the patterns' real relative sizes"><option value="true">True size</option><option value="fit">Fit each</option></select>
    <button id="ov-close">✕</button></div>
  <canvas id="ovc"></canvas>
  <div class="ch tb"><button id="ov-save" title="Save the overlay as a PNG with the layer setup embedded">Save PNG</button>
    <select id="ov-px" title="Image size"><option value="1024">1024 px</option><option value="2048" selected>2048 px</option><option value="4096">4096 px</option></select>
    <button id="ov-open" title="Load a saved PNG (or drop one anywhere on the page)">Open…</button>
    <button id="ov-link" title="Copy a link that re-creates this overlay (data is in the URL)">🔗 Copy link</button>
    <input type="file" id="ov-file" accept="image/png" hidden>
    <span class="sp"></span><button id="ov-clear">Clear</button></div>
  <div class="ch tb"><label style="color:var(--dim)">Album</label>
    <select id="ov-albumsel" title="Which album the button adds to (same selection as in the Albums view)" style="flex:1;min-width:0"></select>
    <button id="ov-album" title="Add the current overlay to the selected album">＋ Add to album</button></div>
  <div id="ov-msg"></div>
  <div id="tab-layers" class="pane">
    <div id="layers"></div>
    <p class="hint" id="ov-hint">Click patterns in the grid to add them as layers. All layers share one centre. Drop a saved PNG here to re-open it.</p>
  </div>
</aside>

<dialog id="pm">
  <div class="pm-head">
    <b>Custom part</b>
    <input type="text" id="pm-name" maxlength="24" placeholder="Name" size="16">
    <label title="The shape is scaled so its edge is exactly this many teeth long: that is what makes it mesh with the rest of the set">Size
      <input type="range" id="pm-N" min="24" max="110"><output id="pm-Nv"></output> teeth</label>
    <span class="sp"></span>
    <button id="pm-save" class="primary">Save part</button><button id="pm-copy" title="Keep the original and save this as a new part">Save as copy</button>
    <button id="pm-del">Delete</button><button id="pm-x" title="Close">✕</button>
  </div>
  <div class="pm-body">
    <div class="pm-left">
      <div class="pm-tabs"><button id="pm-t-shape" class="on">Shape</button><button id="pm-t-holes">Pen holes</button></div>
      <canvas id="pm-c" tabindex="0"></canvas>
      <div id="pm-hint"></div>
    </div>
    <div class="pm-right">
      <div class="pm-sec" id="pm-p-shape"><h4>Shape</h4>
        <div class="ctl"><label>Start from <select id="pm-preset"></select></label>
          <button id="pm-rand" title="Randomise the handles, keeping symmetry">Surprise me</button></div>
        <div class="ctl"><label title="Repeat the section you edit this many times around the part">Symmetry <select id="pm-k"></select></label>
          <label title="Handles per section: more handles, more detail"><select id="pm-n"></select> handles per section</label>
          <label title="Also mirror each section"><input type="checkbox" id="pm-mir"> Mirror</label></div>
      </div>
      <div class="pm-sec" id="pm-p-holes" hidden><h4>Pen holes</h4>
        <div class="ctl"><label>Fill <select id="pm-fill"><option value="x">row along the x axis</option><option value="y">row along the y axis</option>
          <option value="xy">both axes</option><option value="grid">grid</option></select></label>
          <label>every <input type="number" id="pm-sp" min="1" max="8" step="0.5" value="1.5" style="width:4.5em"> teeth</label>
          <button id="pm-dofill">Fill</button><button id="pm-sort" title="Number the holes from the rim to the centre, like the real wheels">Number rim → centre</button>
          <button id="pm-rm" title="Remove the selected hole (or press Delete / right-click it)">Remove selected</button><button id="pm-clear">Clear</button></div>
      </div>
      <div class="pm-sec"><h4>Fits with the set <span style="text-transform:none;letter-spacing:0">(click one to preview)</span></h4>
        <div id="pm-compat"></div><div id="pm-sum"></div></div>
      <div class="pm-sec"><h4>Roll preview</h4>
        <div class="ctl"><span id="pm-pl"></span><label>pen hole <select id="pm-ph"></select></label></div>
        <canvas id="pm-v"></canvas></div>
      <div id="pm-msg"></div>
    </div>
  </div>
</dialog>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

// ======================================================= BEGIN CORE (pure math)
// Units: one tooth of arc length = 1. A piece with N teeth has an outline of perimeter N.
const TAU = Math.PI * 2;
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const lcm = (a, b) => a / gcd(a, b) * b;
const PER_TOOTH = 4;                          // outline samples per tooth

// What's in the box. Round wheels are named by tooth count; shapes by name with an estimated size.
const PARTS = {
  rings: [{ outer: 144, inner: 96 }, { outer: 150, inner: 105 }],
  rack: { N: 150, aspect: 7.8 },              // long stadium shape; teeth on the outside only
  wheels: [24, 30, 32, 40, 42, 45, 48, 52, 56, 60, 63, 72, 75, 80, 84],
  // Shaped wheels: N = teeth the piece meshes with; holes = [x, y] in tooth units from the piece
  // centre (y up), numbered in order. The Cross's arm ends lie on a circle, so it rolls like a
  // 60-tooth wheel (pitch circle) while its real silhouette is used for collision and pictures.
  shapes: [
    { key: 'eye', name: 'Eye', N: 60, holes: [[-8.5, .6], [-6.3, .6], [-4.3, .6], [-2.4, .6], [-.9, .6],
      [-.2, -2.5], [1.7, -2.4], [3.5, -1.8], [5.5, -.8], [7.5, -1.1], [.3, -4.3], [3.1, -3.9], [5.3, -2.9]] },
    { key: 'bar', name: 'Bar', N: 42, holes: [[0, 4.9], [0, 3], [0, 1.2], [-2.8, -1], [-2.8, -2.8], [-2.8, -4.7],
      [2.8, -1], [2.8, -2.8], [2.8, -4.7]] },
    { key: 'triangle', name: 'Triangle', N: 53, holes: [[-.15, 7.9], [-2, 6.5], [1.7, 6.5], [-2.2, 4.4], [-.15, 4.2],
      [1.7, 4.4], [-2.2, -1.8], [-.15, -1.8], [1.7, -1.8], [-2.6, -3.75], [-.15, -3.75], [1.9, -3.75]] },
    { key: 'cross', name: 'Cross', N: 60, holes: [[0, 8.1], [0, 5.9], [0, 3.9], [0, 2.2],
      [-8.5, -1.7], [-6.3, -1.7], [-4.4, -1.7], [4.4, -1.7], [6.3, -1.7], [7.9, -1.7]] },
  ],
};

// ---- outlines: closed CCW curves resampled to exactly N*PER_TOOTH points, centred on the origin

  const jobs = [], add = (grp, label) => { const g = document.createElement('div'); g.className = 'grp'; g.textContent = label; box.append(g); };
  const mk = (key, icon, title, kind, id) => {
    const b = document.createElement('button'); b.className = 'wait' + (ed.partner.kind === kind && ed.partner.id === id ? ' on' : '');
    b.dataset.key = key; b.innerHTML = icon; b.title = title + ' (checking…)';
    b.onclick = () => { ed.partner = { kind, id }; ed.userPicked = true; ed.phole = 1; box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); fillPartnerHoles(); pvStart(); };
    box.append(b); return b;
  };
  add('t', 'Your part rolls around / inside:');
  for (const t of edTracks()) { const key = 't:' + t.id, b = mk(key, trackIcon(t), t.name + (t.inside ? ' (inside)' : ' (outside)'), 't', t.id); jobs.push({ key, b, t, r: me.roller }); }
  add('r', 'Rolls around your part:');
  for (const r of edRollers()) { const key = 'r:' + r.id, b = mk(key, rollerIcon(r, 0), r.name, 'r', r.id); jobs.push({ key, b, t: me.fixed, r }); }
  (function step() {
    if (gen !== edGen || !pm.open) return;
    const t0 = performance.now();
    while (jobs.length && performance.now() - t0 < 10) {
      const j = jobs.shift(), ok = pairFits(j.t, j.r, sdfMemo); edFit.set(j.key, ok);
      j.b.className = (ok ? 'ok' : 'bad') + (j.b.classList.contains('on') ? ' on' : ''); j.b.title = j.b.title.replace(' (checking…)', ok ? ': fits' : ': would overlap');
    }
    if (jobs.length) { edTimer = setTimeout(step, 0); return; }
    const a = [...edFit].filter(([k]) => k[0] === 't'), b = [...edFit].filter(([k]) => k[0] === 'r');
    const fitsN = a.filter(x => x[1]).length;
    $('pm-sum').textContent = `Rolls on ${fitsN} of ${a.length} pieces; ${b.filter(x => x[1]).length} of ${b.length} can roll around it. Green fits, red would overlap.` +
      (fitsN < 6 ? ' Thin or deeply lobed shapes rarely mesh with the round parts: try shallower lobes, a rounder shape, or another size.' : '');
    if (!ed.userPicked && !edFit.get(`${ed.partner.kind}:${ed.partner.id}`)) {         // nothing chosen yet: preview something that fits
      const first = [...edFit].find(([, ok]) => ok);
      if (first) { ed.partner = { kind: first[0][0], id: first[0].slice(2) }; box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.key === first[0])); fillPartnerHoles(); pvStart(); }
    }
  })();
}

// -- roll preview: the part (or its partner) rolls and the pen draws
function partnerPieces() {                      // -> { t, r, label } for the chosen partner, or null
  const { kind, id } = ed.partner;
  if (kind === 't') { const t = edTracks().find(x => x.id === id); return t && { t: t.custom && t.pieceId === 'editing' ? edPiece.fixed : t, r: edPiece.roller, label: `Your part rolls ${t.inside ? 'inside' : 'around'} ${t.name}` }; }
  const r = edRollers().find(x => x.id === id); return r && { t: edPiece.fixed, r, label: `${r.name} rolls around your part` };
}
function fillPartnerHoles() {
  const sel = $('pm-ph'), pp = partnerPieces(); if (!pp) return;
  const n = pp.r.holes.length, cur = Math.min(Math.max(1, +sel.value || ed.phole || 1), n);
  if (sel.options.length !== n) { sel.textContent = ''; for (let i = 1; i <= n; i++) sel.add(new Option(i, i)); }
  sel.value = ed.phole = cur;
  const ok = edFit.get(`${ed.partner.kind}:${ed.partner.id}`);
  $('pm-pl').innerHTML = pp.label + (ok === false ? ' <b style="color:#e0793a">(overlaps)</b>' : '');
}
$('pm-ph').onchange = e => { ed.phole = +e.target.value; pvStart(); };
function pvStop() { if (pv) cancelAnimationFrame(pv.raf); pv = null; }
function pvStart() {
  pvStop(); if (!ed || !pm.open) return;
  const pp = partnerPieces(); if (!pp) return;
  const { t, r } = pp, hole = r.holes[(ed.phole || 1) - 1] || r.holes[0]; if (!hole) return;
  const { pts } = traceRaw(t.o, r.o, t.inside, hole, 2500), n = pts.length / 3 - 1, L = lcm(t.o.N, r.o.N);
  const radius = o => { let m = 0; for (let i = 0; i < o.M; i++) m = Math.max(m, Math.hypot(o.p[2 * i], o.p[2 * i + 1])); return m; };
  const fr = radius(t.body || t.o), gr = radius(r.body), bound = (t.inside ? fr : fr + 2 * gr) * 1.06;
  const w = Math.round(Math.min(340, pmv.getBoundingClientRect().width || 300)); pmv.width = pmv.height = Math.round(w * pr);
  pv = { t, r, pts, n, L, bound, w, i: 0, hold: 0, raf: 0, P: [0, 0, 0, 0] };
  const ctx = pmv.getContext('2d'), S = w / (2 * bound), X = x => w / 2 + x * S, Y = y => w / 2 - y * S, ink = palette().colors[0], paper = $('paper').value;
  const poly = (o, tf) => { ctx.beginPath(); for (let i = 0; i < o.M; i++) { const x = o.p[2 * i], y = o.p[2 * i + 1], q = tf ? [tf[2] + tf[0] * x - tf[1] * y, tf[3] + tf[1] * x + tf[0] * y] : [x, y];
    ctx[i ? 'lineTo' : 'moveTo'](X(q[0]), Y(q[1])); } ctx.closePath(); };
  const frame = () => {
    if (!pv || !pm.open) return;
    ctx.setTransform(pr, 0, 0, pr, 0, 0); ctx.fillStyle = paper; ctx.fillRect(0, 0, w, w);
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#8d8b86'; ctx.fillStyle = 'rgba(0,0,0,.06)';
    if (t.inside) { ctx.beginPath(); ctx.arc(X(0), Y(0), fr * S, 0, TAU); ctx.stroke(); } else { poly(t.body || t.o); ctx.fill(); ctx.stroke(); }
    const k = Math.min(Math.floor(pv.i), n); pose(t.o, r.o, t.inside, L * k / n, pv.P);
    ctx.strokeStyle = ink; ctx.lineWidth = 1.4; ctx.beginPath(); for (let i = 0; i <= k; i++) ctx[i ? 'lineTo' : 'moveTo'](X(pts[3 * i]), Y(pts[3 * i + 1])); ctx.stroke();
    poly(r.body, pv.P); ctx.fillStyle = 'rgba(233,180,76,.25)'; ctx.fill(); ctx.strokeStyle = '#555'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.beginPath(); ctx.arc(X(pts[3 * k]), Y(pts[3 * k + 1]), 3.5, 0, TAU); ctx.fillStyle = ink; ctx.fill();
    if (pv.i >= n) { if (++pv.hold > 60) { pv.i = 0; pv.hold = 0; } } else pv.i = Math.min(n, pv.i + n / 420);
    pv.raf = requestAnimationFrame(frame);
  };
  frame();
}

// -- save / delete / close
function edSave(asCopy) {
  const d = canonPart({ ...ed.d, name: ed.name });
  if (!d) return edMsg('Add at least one pen hole first (Pen holes tab)');
  const bad = ed.d.h.filter(holeBad).length;
  if (bad) { edTab('holes'); return edMsg(`${bad} pen hole${bad === 1 ? ' is' : 's are'} too close to the edge (shown in red); move or delete ${bad === 1 ? 'it' : 'them'}`, 8000); }
  const next = []; let placed = false;
  for (const x of library) {
    if (x.id === ed.orig && !asCopy) { next.push(d); placed = true; } else if (x.id !== d.id) next.push(x);
  }
  if (!placed && !library.some(x => x.id === d.id)) { if (next.length >= PART_LIMITS.maxLibrary) return edMsg(`Your library is full (${PART_LIMITS.maxLibrary} parts); delete one first`, 8000); next.push(d); }
  else if (!placed) next.push(d);
  library = next; registry.set(d.id, d);
  pieceMemo.delete(d.id); guestCombos.clear();        // same content may come back under a new name
  ed.dirty = false; pm.close(); libraryChanged(d.id);
}
function edClose() { if (ed?.dirty && !confirm('Discard your changes to this part?')) return; ed.dirty = false; pm.close(); }
$('pm-save').onclick = () => edSave(false); $('pm-copy').onclick = () => edSave(true); $('pm-x').onclick = edClose;
$('pm-del').onclick = () => {
  if (!confirm(`Delete "${ed.name}"? Saved PNGs, albums and links that use it keep their own copy.`)) return;
  library = library.filter(x => x.id !== ed.orig); ed.dirty = false; pm.close(); libraryChanged();
};
pm.addEventListener('cancel', ev => { if (ed?.dirty && !confirm('Discard your changes to this part?')) ev.preventDefault(); });
pm.addEventListener('close', () => { pvStop(); clearTimeout(edTimer); clearTimeout(pvTimer); edGen++; ed = null; });
window.addEventListener('resize', () => { if (ed && pm.open) { edResize(); edDraw(); pvStart(); } });

// ---------------------------------------------------------------- start
setTimeout(() => {                              // let "Preparing…" paint before the heavy enumeration
  const t0 = performance.now();
  CAT = buildCatalog(); ALL = CAT.combos; ALL.forEach((p, i) => { p.key = i; }); okCount = ALL.filter(p => p.ok).length;
  console.log(`catalog: ${okCount} of ${ALL.length} patterns fit, ${Math.round(performance.now() - t0)} ms`);
  const t1 = performance.now();
  library = parseParts(store.get(PARTS_KEY)); library.forEach(d => registry.set(d.id, d)); rebuildCustom();
  if (library.length) console.log(`custom parts: ${library.length} in library, ${CUSTOM.length} combos, ${Math.round(performance.now() - t1)} ms`);
  buildFilters(); buildCustomRow(); refilter(); applyHash();
}, 30);
</script>
