<!--
  index.html — Spirograph pattern gallery: every ring/wheel/hole combination of a Deluxe-style set.

  Role: this is the whole app (single static page, no build step, no server). It enumerates every
  valid combination of the parts in PARTS below, lays them out in a virtualized grid, and draws
  only the tiles currently on screen with three.js (one shared canvas, one scissored viewport per
  tile). Curves for tiles that scroll away are disposed and rebuilt on demand.

  Usage: open index.html in a browser (needs network for the three.js CDN import map), or run
  `python3 -m http.server` in this directory and visit http://localhost:8000.
  Controls: filter chips (none selected = no filter) for rolling direction, fixed part, moving
  wheel and pen hole; Shuffle / Reset order. Tiles are static drawings.

  Edit PARTS to change the tooth counts or hole layout. Tooth counts and hole positions are a
  best-effort approximation of the Deluxe set, not official specs.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spirograph gallery</title>
<style>
  :root { --bg: #1b1b1f; --panel: #26262c; --ink: #e8e6e1; --dim: #8d8b86; --accent: #e9b44c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; }
  header { position: sticky; top: 0; z-index: 2; background: var(--panel);
    padding: 10px 16px; border-bottom: 1px solid #000; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
  .row > .label { color: var(--dim); width: 92px; flex: none; text-transform: uppercase;
    font-size: 11px; letter-spacing: .05em; }
  .chip, button { font: inherit; color: var(--ink); background: #33333b; border: 1px solid #44444e;
    border-radius: 999px; padding: 1px 9px; cursor: pointer; }
  .chip.on { background: var(--accent); color: #1b1b1f; border-color: var(--accent); }
  button { border-radius: 4px; padding: 3px 10px; }
  #count { margin-left: auto; color: var(--dim); }
  #grid { position: relative; z-index: 1; margin: 16px; }
  .tile { position: absolute; pointer-events: none; }
  .tile span { position: absolute; left: 8px; bottom: 6px; font-size: 11px; color: #4a4741; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<header>
  <div class="row"><span class="label">Rolling</span><span id="f-mode"></span></div>
  <div class="row"><span class="label">Fixed part</span><span id="f-fixed"></span></div>
  <div class="row"><span class="label">Moving wheel</span><span id="f-roller"></span></div>
  <div class="row"><span class="label">Pen hole</span><span id="f-hole"></span>
    <button id="shuffle">Shuffle</button><button id="reset">Reset order</button>
    <span id="count"></span></div>
</header>
<div id="grid"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

// ---------------------------------------------------------------- parts
// Radii are measured in teeth (all parts share one tooth pitch, so radius is proportional to
// tooth count). A wheel's pen holes run from near its rim (hole 1) toward its centre.
const PARTS = {
  rings: [96, 105],                                                  // fixed, teeth inside and out
  wheels: [24, 30, 32, 36, 40, 42, 45, 48, 52, 56, 60, 63, 72, 75, 80, 84],
  holeCount: teeth => Math.max(3, Math.round(teeth / 6)),
  holeOffset: (teeth, k, n) => teeth * (0.85 - 0.70 * (k - 1) / (n - 1)),   // k is 1-based
};
const INKS = ['#1f4fd8', '#c4242b', '#0f8a5f', '#7a2fb3', '#1a1a1a', '#d9730d'];
const PAPER = 0xfaf7f0, PAGE = 0x1b1b1f;
const MIN_TILE = 210, GAP = 10, MAX_POINTS = 30000;

const gcd = (a, b) => b ? gcd(b, a % b) : a;

// ---------------------------------------------------------------- enumeration
const ALL = [];
for (const inside of [true, false]) {
  const fixed = [...PARTS.rings.map(t => ({ kind: 'ring', teeth: t }))];
  if (!inside) fixed.push(...PARTS.wheels.map(t => ({ kind: 'wheel', teeth: t })));
  for (const f of fixed) {
    for (const r of PARTS.wheels) {
      if (inside && r >= f.teeth) continue;
      const n = PARTS.holeCount(r);
      for (let k = 1; k <= n; k++) {
        ALL.push({ inside, fixed: f, R: f.teeth, r, hole: k, d: PARTS.holeOffset(r, k, n),
                   ink: INKS[PARTS.wheels.indexOf(r) % INKS.length] });
      }
    }
  }
}
ALL.forEach((p, i) => { p.id = i; p.label =
  `${p.fixed.kind === 'ring' ? 'Ring' : 'Wheel'} ${p.R} · ${p.inside ? 'inside' : 'outside'} · ` +
  `wheel ${p.r} · hole ${p.hole}`; });

// ---------------------------------------------------------------- curve math
// Hypotrochoid (wheel inside ring) / epitrochoid (wheel outside), closed after r/gcd turns.
function curvePoints(p) {
  const { R, r, d, inside } = p;
  const revs = r / gcd(R, r);
  const k = inside ? (R - r) / r : (R + r) / r;
  const n = Math.min(MAX_POINTS, Math.ceil(revs * (1 + k) * 48));
  const T = 2 * Math.PI * revs, out = new Float32Array((n + 1) * 3);
  let maxR = 0;
  for (let i = 0; i <= n; i++) {
    const t = T * i / n;
    const x = inside ? (R - r) * Math.cos(t) + d * Math.cos(k * t) : (R + r) * Math.cos(t) - d * Math.cos(k * t);
    const y = inside ? (R - r) * Math.sin(t) - d * Math.sin(k * t) : (R + r) * Math.sin(t) - d * Math.sin(k * t);
    out[i * 3] = x; out[i * 3 + 1] = y;
    maxR = Math.max(maxR, Math.hypot(x, y));
  }
  const s = 0.9 / maxR;                      // fit every curve to the tile
  for (let i = 0; i < out.length; i++) out[i] *= s;
  return out;
}

// ---------------------------------------------------------------- three.js setup
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
const pr = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(pr);
renderer.setClearColor(PAGE);
const scene = new THREE.Scene();
scene.background = new THREE.Color(PAPER);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
camera.position.z = 1;
const materials = new Map(INKS.map(c => [c, new LineMaterial({ color: new THREE.Color(c), linewidth: 1.3 * pr })]));
const lineCache = new Map();                 // pattern id -> Line2, only for tiles near the viewport

function lineFor(p) {
  let line = lineCache.get(p.id);
  if (!line) {
    const geo = new LineGeometry();
    geo.setPositions(curvePoints(p));
    line = new Line2(geo, materials.get(p.ink));
    line.frustumCulled = false;
    lineCache.set(p.id, line);
  }
  return line;
}

// ---------------------------------------------------------------- filters
const filters = { mode: new Set(), fixed: new Set(), roller: new Set(), hole: new Set() };
let list = ALL, shuffled = false;

function chips(elId, items, set) {
  const el = document.getElementById(elId);
  for (const [key, text] of items) {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = text;
    b.onclick = () => { set.has(key) ? set.delete(key) : set.add(key); b.classList.toggle('on'); refilter(); };
    el.append(b);
  }
}
chips('f-mode', [['in', 'Inside ring'], ['out', 'Outside']], filters.mode);
chips('f-fixed', [...PARTS.rings.map(t => [`ring:${t}`, `Ring ${t}`]),
                  ...PARTS.wheels.map(t => [`wheel:${t}`, `Wheel ${t}`])], filters.fixed);
chips('f-roller', PARTS.wheels.map(t => [t, t]), filters.roller);
chips('f-hole', Array.from({ length: Math.max(...PARTS.wheels.map(PARTS.holeCount)) }, (_, i) => [i + 1, i + 1]), filters.hole);

function seededShuffle(arr, seed) {
  const a = arr.slice(); let s = seed >>> 0;
  const rnd = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function refilter() {
  const f = filters;
  list = ALL.filter(p =>
    (!f.mode.size || f.mode.has(p.inside ? 'in' : 'out')) &&
    (!f.fixed.size || f.fixed.has(`${p.fixed.kind}:${p.R}`)) &&
    (!f.roller.size || f.roller.has(p.r)) &&
    (!f.hole.size || f.hole.has(p.hole)));
  if (shuffled) list = seededShuffle(list, shuffled);
  document.getElementById('count').textContent = `${list.length.toLocaleString()} of ${ALL.length.toLocaleString()} patterns`;
  for (const l of lineCache.values()) l.geometry.dispose();
  lineCache.clear();
  layout(); window.scrollTo(0, 0); schedule();
}
document.getElementById('shuffle').onclick = () => { shuffled = (Math.random() * 2 ** 31) | 1; refilter(); };
document.getElementById('reset').onclick = () => { shuffled = false; refilter(); };

// ---------------------------------------------------------------- virtualized grid
const grid = document.getElementById('grid');
const tiles = new Map();                     // list index -> DOM label element
let cols = 1, tile = MIN_TILE, pitch = MIN_TILE + GAP;

function layout() {
  const w = grid.parentElement.clientWidth - 32;
  cols = Math.max(1, Math.floor((w + GAP) / (MIN_TILE + GAP)));
  tile = (w - GAP * (cols - 1)) / cols;
  pitch = tile + GAP;
  grid.style.height = `${Math.ceil(list.length / cols) * pitch - GAP}px`;
  for (const m of materials.values()) m.resolution.set(tile * pr, tile * pr);
  for (const el of tiles.values()) el.remove();
  tiles.clear();
}

let queued = false;
const schedule = () => { if (!queued) { queued = true; requestAnimationFrame(draw); } };

function draw() {
  queued = false;
  const vw = window.innerWidth, vh = window.innerHeight;
  renderer.setSize(vw, vh, false);
  const gr = grid.getBoundingClientRect();   // top is relative to the viewport
  const first = Math.max(0, Math.floor(-gr.top / pitch) - 1);
  const last = Math.min(Math.ceil(list.length / cols) - 1, Math.floor((vh - gr.top) / pitch));
  const from = first * cols, to = Math.min(list.length, (last + 1) * cols);

  renderer.setScissorTest(false);
  renderer.clear();
  renderer.setScissorTest(true);
  const keep = new Set();
  for (let i = from; i < to; i++) {
    const p = list[i], row = Math.floor(i / cols), col = i % cols;
    const x = gr.left + col * pitch, y = gr.top + row * pitch;
    keep.add(p.id);
    let el = tiles.get(i);
    if (!el) {
      el = document.createElement('div'); el.className = 'tile';
      el.innerHTML = `<span>${p.label}</span>`;
      el.style.cssText = `left:${col * pitch}px;top:${row * pitch}px;width:${tile}px;height:${tile}px`;
      grid.append(el); tiles.set(i, el);
    }
    if (y > vh || y + tile < 0) continue;
    const gy = vh - (y + tile);
    renderer.setViewport(x, gy, tile, tile);
    renderer.setScissor(x, gy, tile, tile);
    const line = lineFor(p);
    scene.add(line); renderer.render(scene, camera); scene.remove(line);
  }
  // Throw away anything that has scrolled out of range.
  for (const [i, el] of tiles) if (i < from || i >= to) { el.remove(); tiles.delete(i); }
  for (const [id, l] of lineCache) if (!keep.has(id)) { l.geometry.dispose(); lineCache.delete(id); }
}

window.addEventListener('scroll', schedule, { passive: true });
window.addEventListener('resize', () => { layout(); schedule(); });
refilter();
</script>
</body>
</html>
