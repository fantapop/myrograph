<!--
  index.html — Spirograph pattern gallery: every ring/wheel/shape/pen-hole combination of a
  Deluxe-style set (rings 144/96 and 150/105, rack, 15 round wheels, Eye/Bar/Triangle/Cross).

  Role: this is the whole app (single static page, no build step, no server). The CORE section
  is pure math: it builds each piece's tooth outline, rolls one piece around/inside another with
  tooth-for-tooth contact (works for any closed outline, not just circles), and rejects pairs
  whose pieces would overlap. The UI section enumerates the valid combinations, lays them out in
  a virtualized grid, and for tiles on screen renders the curve with three.js into an offscreen
  WebGL canvas, copying the result into a plain 2D canvas inside the tile (so tiles scroll
  natively with their labels). Tiles that scroll away are discarded and redrawn on demand.

  Usage: open index.html in a browser (needs network for the three.js CDN import map), or run
  `python3 -m http.server` in this directory and visit http://localhost:8000.
  Controls: filter chips with piece pictures (none selected = no filter), ink and paper colors,
  Shuffle / Reset order. Combos whose pieces would physically collide while rolling (found by
  simulation) are hidden unless "Include overlapping combos" is on.

  Edit PARTS to change tooth counts, shapes or hole layouts. Ring/rack/wheel tooth counts and
  hole counts follow published charts; the shaped wheels' sizes and hole positions are estimates.
  The CORE block between the BEGIN/END markers is extracted and tested under node.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spirograph gallery</title>
<style>
  :root { --bg: #1b1b1f; --panel: #26262c; --ink: #e8e6e1; --dim: #8d8b86; --accent: #e9b44c; --paper: #faf7f0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid #000;
    padding: 8px 16px; max-height: 50vh; overflow: auto; }
  summary { cursor: pointer; color: var(--dim); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 6px; }
  .row > .label { color: var(--dim); width: 92px; flex: none; text-transform: uppercase;
    font-size: 11px; letter-spacing: .05em; }
  .row > .chips { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; min-width: 0; }
  .chip, button { font: inherit; color: var(--ink); background: #33333b; border: 1px solid #44444e;
    border-radius: 999px; padding: 1px 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .chip.pic { border-radius: 8px; padding: 3px 7px 3px 4px; }
  .chip svg { width: 28px; height: 28px; flex: none; }
  .chip.on { background: var(--accent); color: #1b1b1f; border-color: var(--accent); }
  button { border-radius: 4px; padding: 3px 10px; }
  .swatch { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 2px solid #44444e; }
  .swatch.on { border-color: #fff; }
  input[type=color] { width: 28px; height: 24px; padding: 0; border: 1px solid #44444e; background: none; cursor: pointer; }
  #count { margin-left: auto; color: var(--dim); }
  #grid { position: relative; margin: 16px; }
  .tile { position: absolute; background: var(--panel); border-radius: 6px; overflow: hidden; }
  .tile canvas { display: block; width: 100%; aspect-ratio: 1; background: var(--paper); }
  .foot { height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 11px; line-height: 1.25; }
  .foot svg { width: 30px; height: 30px; flex: none; color: var(--dim); }
  .foot .txt { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot .txt b { font-weight: 600; }
</style>
</head>
<body>
<header>
  <details open>
    <summary>Filters</summary>
    <div class="row"><span class="label">Rolling</span><span class="chips" id="f-mode"></span></div>
    <div class="row"><span class="label">Fixed part</span><span class="chips" id="f-fixed"></span></div>
    <div class="row"><span class="label">Moving piece</span><span class="chips" id="f-roller"></span></div>
    <div class="row"><span class="label">Pen hole</span><span class="chips" id="f-hole"></span></div>
    <div class="row"><span class="label">Ink</span><span class="chips" id="f-ink"></span>
      <span class="label" style="width:auto;margin-left:12px">Paper</span>
      <input type="color" id="paper" value="#faf7f0">
      <button id="shuffle">Shuffle</button><button id="reset">Reset order</button>
      <span id="count">Preparing…</span></div>
  </details>
</header>
<div id="grid"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

// ======================================================= BEGIN CORE (pure math)
// Units: one tooth of arc length = 1. A piece with N teeth has an outline of perimeter N.
const TAU = Math.PI * 2;
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const lcm = (a, b) => a / gcd(a, b) * b;
const PER_TOOTH = 4;                          // outline samples per tooth

// What's in the box. Round wheels are named by tooth count; shapes by name with an estimated size.
const PARTS = {
  rings: [{ outer: 144, inner: 96 }, { outer: 150, inner: 105 }],
  rack: { N: 150, aspect: 3.5 },              // stadium shape; teeth on the outside only
  wheels: [24, 30, 32, 40, 42, 45, 48, 52, 56, 60, 63, 72, 75, 80, 84],
  shapes: [{ key: 'eye', name: 'Eye', N: 64 }, { key: 'bar', name: 'Bar', N: 64 },
           { key: 'triangle', name: 'Triangle', N: 60 }, { key: 'cross', name: 'Cross', N: 72 }],
};

// ---- outlines: closed CCW curves resampled to exactly N*PER_TOOTH points, centred on the origin
function makeOutline(dense, N) {
  let pts = dense, area = 0;
  for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; area += a[0] * b[1] - b[0] * a[1]; }
  if (area < 0) pts = pts.slice().reverse();
  const n = pts.length, cum = new Float64Array(n + 1);
  for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; cum[i + 1] = cum[i] + Math.hypot(b[0] - a[0], b[1] - a[1]); }
  const total = cum[n], scale = N / total, M = N * PER_TOOTH, p = new Float64Array(2 * M);
  let j = 0, cx = 0, cy = 0;
  for (let k = 0; k < M; k++) {
    const target = total * k / M;
    while (cum[j + 1] < target) j++;
    const a = pts[j], b = pts[(j + 1) % n], t = (target - cum[j]) / (cum[j + 1] - cum[j] || 1);
    p[2 * k] = (a[0] + (b[0] - a[0]) * t) * scale; p[2 * k + 1] = (a[1] + (b[1] - a[1]) * t) * scale;
    cx += p[2 * k]; cy += p[2 * k + 1];
  }
  cx /= M; cy /= M;
  for (let k = 0; k < M; k++) { p[2 * k] -= cx; p[2 * k + 1] -= cy; }
  const t = new Float64Array(2 * M);
  for (let k = 0; k < M; k++) {
    const a = (k + M - 1) % M, b = (k + 1) % M;
    const dx = p[2 * b] - p[2 * a], dy = p[2 * b + 1] - p[2 * a + 1], l = Math.hypot(dx, dy);
    t[2 * k] = dx / l; t[2 * k + 1] = dy / l;
  }
  return { N, M, p, t };
}
const circleDense = () => Array.from({ length: 720 }, (_, i) => [Math.cos(TAU * i / 720), Math.sin(TAU * i / 720)]);
function stadiumDense(aspect) {                // length : width = aspect : 1
  const c = (aspect - 1) / 2, pts = [];
  for (let i = 0; i <= 48; i++) { const a = -Math.PI / 2 + Math.PI * i / 48; pts.push([c + 0.5 * Math.cos(a), 0.5 * Math.sin(a)]); }
  for (let i = 0; i <= 48; i++) { const a = Math.PI / 2 + Math.PI * i / 48; pts.push([-c + 0.5 * Math.cos(a), 0.5 * Math.sin(a)]); }
  return pts;
}
function eyeDense() {                          // football: pointed-ish lens, long axis along x
  const up = [], b = 0.36;
  for (let i = 0; i <= 80; i++) { const x = -Math.cos(Math.PI * i / 80); up.push([x, b * Math.pow(1 - x * x, 0.8)]); }
  return up.concat(up.slice(1, -1).reverse().map(([x, y]) => [x, -y]));
}
function roundedPoly(v, cut, iters) {          // cut every corner, then Chaikin-smooth
  let pts = [];
  for (let i = 0; i < v.length; i++) {
    const p = v[(i + v.length - 1) % v.length], c = v[i], n = v[(i + 1) % v.length];
    pts.push([c[0] + (p[0] - c[0]) * cut, c[1] + (p[1] - c[1]) * cut], [c[0] + (n[0] - c[0]) * cut, c[1] + (n[1] - c[1]) * cut]);
  }
  for (let it = 0; it < iters; it++) {
    const next = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      next.push([.75 * a[0] + .25 * b[0], .75 * a[1] + .25 * b[1]], [.25 * a[0] + .75 * b[0], .25 * a[1] + .75 * b[1]]);
    }
    pts = next;
  }
  return pts;
}
const triangleDense = () => roundedPoly([0, 1, 2].map(i => [Math.cos(TAU * i / 3), Math.sin(TAU * i / 3)]), 0.2, 3);
const crossDense = () => roundedPoly([[.5, .5], [.5, 1.5], [-.5, 1.5], [-.5, .5], [-1.5, .5], [-1.5, -.5], [-.5, -.5],
  [-.5, -1.5], [.5, -1.5], [.5, -.5], [1.5, -.5], [1.5, .5]], 0.18, 3);

// Pen holes in a piece's local frame (same units as the outline).
function lineHoles(o, n, from, to) {           // n holes along +x axis, fractions of the x extent
  let a = 0; for (let k = 0; k < o.M; k++) a = Math.max(a, o.p[2 * k]);
  return Array.from({ length: n }, (_, k) => [a * (from + (to - from) * k / (n - 1)), 0]);
}
function wheelHoles(N) {                       // 5 holes on the 24 up to 35 on the 84, rim to centre
  const n = Math.round(N / 2 - 7), r = N / TAU, d0 = r - 0.5, d1 = 0.3 * r;
  return Array.from({ length: n }, (_, k) => [d0 + (d1 - d0) * k / (n - 1), 0]);
}

// ---- rolling
const _f = [0, 0, 0, 0], _g = [0, 0, 0, 0];
function sample(o, s, out) {                   // position + tangent at arc length s
  let q = (s * PER_TOOTH) % o.M; if (q < 0) q += o.M;
  const i = Math.floor(q), f = q - i, j = (i + 1) % o.M, p = o.p, t = o.t;
  out[0] = p[2 * i] + (p[2 * j] - p[2 * i]) * f; out[1] = p[2 * i + 1] + (p[2 * j + 1] - p[2 * i + 1]) * f;
  const tx = t[2 * i] + (t[2 * j] - t[2 * i]) * f, ty = t[2 * i + 1] + (t[2 * j + 1] - t[2 * i + 1]) * f, l = Math.hypot(tx, ty);
  out[2] = tx / l; out[3] = ty / l;
}
// Pose of roller G after travelling s teeth along fixed track F with teeth meshing: the contact
// points coincide and their tangents line up. Inside: both curves run the same way; outside:
// opposite ways. out = [cos, sin, tx, ty] of the rigid transform local -> world.
function pose(F, G, inside, s, out) {
  sample(F, s, _f); sample(G, inside ? s : -s, _g);
  const tx = inside ? _f[2] : -_f[2], ty = inside ? _f[3] : -_f[3];
  let c = _g[2] * tx + _g[3] * ty, sn = _g[2] * ty - _g[3] * tx; const l = Math.hypot(c, sn); c /= l; sn /= l;
  out[0] = c; out[1] = sn; out[2] = _f[0] - (c * _g[0] - sn * _g[1]); out[3] = _f[1] - (sn * _g[0] + c * _g[1]);
}
// Pen path for one hole, scaled to fit radius 0.9. Closes after lcm(NF, NG) teeth of travel.
function trace(F, G, inside, hole, maxPts = 30000) {
  const L = lcm(F.N, G.N), n = Math.min(maxPts, Math.ceil(L * 4)), out = new Float32Array((n + 1) * 3), P = [0, 0, 0, 0];
  let maxR = 0;
  for (let i = 0; i <= n; i++) {
    pose(F, G, inside, L * i / n, P);
    const x = P[2] + P[0] * hole[0] - P[1] * hole[1], y = P[3] + P[1] * hole[0] + P[0] * hole[1];
    out[3 * i] = x; out[3 * i + 1] = y; maxR = Math.max(maxR, Math.hypot(x, y));
  }
  const s = 0.9 / maxR;
  for (let i = 0; i < out.length; i++) out[i] *= s;
  return out;
}

// ---- collision check: would the two physical pieces overlap at any point of the roll?
function makeSDF(F) {                          // free-space distance field around a fixed piece (+ outside)
  let B = 0; for (let k = 0; k < F.M; k++) B = Math.max(B, Math.abs(F.p[2 * k]), Math.abs(F.p[2 * k + 1]));
  B += 6;
  const cell = 0.6, n = Math.ceil(2 * B / cell) + 1, g = new Float32Array(n * n), K = F.N, xs = new Float64Array(K), ys = new Float64Array(K);
  for (let k = 0; k < K; k++) { xs[k] = F.p[2 * k * PER_TOOTH]; ys[k] = F.p[2 * k * PER_TOOTH + 1]; }
  for (let gy = 0; gy < n; gy++) for (let gx = 0; gx < n; gx++) {
    const px = -B + gx * cell, py = -B + gy * cell; let d2 = Infinity, inside = false;
    for (let k = 0, j = K - 1; k < K; j = k++) {
      const ax = xs[j], ay = ys[j], bx = xs[k], by = ys[k], ex = bx - ax, ey = by - ay;
      const t = Math.max(0, Math.min(1, ((px - ax) * ex + (py - ay) * ey) / (ex * ex + ey * ey)));
      const dx = px - ax - t * ex, dy = py - ay - t * ey, dd = dx * dx + dy * dy;
      if (dd < d2) d2 = dd;
      if ((ay > py) !== (by > py) && px < ax + (py - ay) / (by - ay) * ex) inside = !inside;
    }
    g[gy * n + gx] = inside ? -Math.sqrt(d2) : Math.sqrt(d2);
  }
  return { at(x, y) {
    const u = (x + B) / cell, v = (y + B) / cell;
    if (u < 0 || v < 0 || u >= n - 1 || v >= n - 1) return 100;
    const i = Math.floor(u), j = Math.floor(v), fu = u - i, fv = v - j, o = j * n + i;
    return (g[o] * (1 - fu) + g[o + 1] * fu) * (1 - fv) + (g[o + n] * (1 - fu) + g[o + n + 1] * fu) * fv;
  } };
}
// F: fixed outline; for inside tracks it must be a circle (the ring's opening).
function fits(F, G, inside, sdf, tol = 0.4) {
  const L = lcm(F.N, G.N), steps = Math.ceil(L / 1.5), S = 36, stride = Math.floor(G.M / S), P = [0, 0, 0, 0], rin = F.N / TAU;
  for (let st = 0; st < steps; st++) {
    pose(F, G, inside, L * st / steps, P);
    for (let j = 0; j < S; j++) {
      const lx = G.p[2 * j * stride], ly = G.p[2 * j * stride + 1];
      const x = P[2] + P[0] * lx - P[1] * ly, y = P[3] + P[1] * lx + P[0] * ly;
      if ((inside ? rin - Math.hypot(x, y) : sdf.at(x, y)) < -tol) return false;
    }
  }
  return true;
}

// ---- the box of parts -> pieces, tracks (fixed parts) and every valid combination
function buildCatalog() {
  const roundWheel = N => ({ id: 'w' + N, name: 'Wheel ' + N, N, o: makeOutline(circleDense(), N), holes: wheelHoles(N), round: true });
  const rollers = PARTS.wheels.map(roundWheel);
  for (const s of PARTS.shapes) {
    const dense = { eye: eyeDense, bar: () => stadiumDense(4), triangle: triangleDense, cross: crossDense }[s.key]();
    const o = makeOutline(dense, s.N);
    let holes;
    if (s.key === 'bar') holes = lineHoles(o, 9, 0.85, 0.05);
    else if (s.key === 'eye') holes = lineHoles(o, 13, 0.9, -0.9);
    else if (s.key === 'cross') holes = lineHoles(o, 9, 0.85, 0.05);
    else { holes = lineHoles(o, 10, 0.8, -0.35); }          // triangle: ray from a vertex through the centre
    rollers.push({ id: s.key, name: s.name, N: s.N, o, holes });
  }
  const tracks = [];
  for (const r of PARTS.rings) {
    tracks.push({ id: `ring${r.inner}-in`, name: `Ring ${r.inner} inner`, kind: 'ring', inside: true, which: 'inner', ratio: r.inner / r.outer, o: makeOutline(circleDense(), r.inner) });
    tracks.push({ id: `ring${r.outer}-out`, name: `Ring ${r.outer} outer`, kind: 'ring', inside: false, which: 'outer', ratio: r.inner / r.outer, o: makeOutline(circleDense(), r.outer) });
  }
  tracks.push({ id: 'rack', name: `Rack ${PARTS.rack.N}`, kind: 'rack', inside: false, o: makeOutline(stadiumDense(PARTS.rack.aspect), PARTS.rack.N) });
  for (const w of rollers) tracks.push({ id: 'fix-' + w.id, name: w.name, kind: 'piece', pieceId: w.id, inside: false, o: w.o, round: w.round });
  const combos = [];
  for (const t of tracks) {
    const sdf = t.inside ? null : makeSDF(t.o);
    for (const r of rollers) {
      if (t.pieceId === r.id) continue;                    // one physical piece can't be both
      const ok = fits(t.o, r.o, t.inside, sdf);            // false: the pieces would overlap while rolling
      for (let k = 0; k < r.holes.length; k++) combos.push({ track: t, roller: r, rollerIdx: rollers.indexOf(r), hole: k + 1, ok });
    }
  }
  return { rollers, tracks, combos };
}
// ======================================================= END CORE

// ---------------------------------------------------------------- UI constants and state
const INKS = ['#1f4fd8', '#c4242b', '#0f8a5f', '#7a2fb3', '#1a1a1a', '#d9730d'];
const MIN_TILE = 210, GAP = 10, FOOT = 44, BUDGET_MS = 10;
const $ = id => document.getElementById(id);
const pr = Math.min(window.devicePixelRatio || 1, 2);
let CAT, ALL, list = [], shuffled = false, inkMode = 'auto', showOverlap = false, okCount = 0;
const filters = { mode: new Set(), fixed: new Set(), roller: new Set(), hole: new Set() };

// ---------------------------------------------------------------- icons (pictures of the pieces)
const iconCache = new Map();
function outlinePath(o) {
  let rm = 0; for (let k = 0; k < o.M; k++) rm = Math.max(rm, Math.hypot(o.p[2 * k], o.p[2 * k + 1]));
  let d = '';
  for (let k = 0; k < o.N; k++) { const i = 2 * k * PER_TOOTH; d += `${k ? 'L' : 'M'}${(o.p[i] / rm).toFixed(3)} ${(-o.p[i + 1] / rm).toFixed(3)}`; }
  return { d: d + 'Z', rm };
}
const svg = body => `<svg viewBox="-1.15 -1.15 2.3 2.3" fill="none" stroke="currentColor" stroke-width="0.07" stroke-linejoin="round">${body}</svg>`;
function trackIcon(t) {
  const key = 't' + t.id;
  if (!iconCache.has(key)) {
    let body;
    if (t.kind === 'ring') {
      const hot = 'stroke="var(--accent)" stroke-width="0.13"';
      body = `<circle r="1" fill="currentColor" fill-opacity=".18" ${t.which === 'outer' ? hot : ''}/>` +
             `<circle r="${t.ratio}" fill="var(--panel)" ${t.which === 'inner' ? hot : ''}/>`;
    } else body = `<path d="${outlinePath(t.o).d}" fill="currentColor" fill-opacity=".18"/>`;
    iconCache.set(key, svg(body));
  }
  return iconCache.get(key);
}
function rollerIcon(r, hole) {                  // hole: 1-based highlighted hole, or 0 for none
  const key = `r${r.id}:${hole}`;
  if (!iconCache.has(key)) {
    const { d, rm } = outlinePath(r.o);
    let body = `<path d="${d}" fill="currentColor" fill-opacity=".18"/>`;
    r.holes.forEach(([x, y], k) => {
      body += k + 1 === hole ? `<circle cx="${x / rm}" cy="${-y / rm}" r=".13" fill="var(--accent)" stroke="none"/>`
                             : `<circle cx="${x / rm}" cy="${-y / rm}" r=".045" fill="currentColor" stroke="none" opacity=".55"/>`;
    });
    iconCache.set(key, svg(body));
  }
  return iconCache.get(key);
}

// ---------------------------------------------------------------- filter UI
function chip(container, set, key, html, pic) {
  const b = document.createElement('button');
  b.className = 'chip' + (pic ? ' pic' : ''); b.innerHTML = html;
  b.onclick = () => { set.has(key) ? set.delete(key) : set.add(key); b.classList.toggle('on'); refilter(); };
  $(container).append(b);
}
function buildFilters() {
  chip('f-mode', filters.mode, 'in', 'Inside a ring'); chip('f-mode', filters.mode, 'out', 'Around the outside');
  const ov = document.createElement('button'); ov.className = 'chip'; ov.style.marginLeft = '12px';
  ov.title = 'Pieces that would physically collide while rolling (e.g. the Cross, or a Bar inside a ring) are hidden by default';
  ov.textContent = 'Include overlapping combos';
  ov.onclick = () => { showOverlap = !showOverlap; ov.classList.toggle('on', showOverlap); refilter(); };
  $('f-mode').append(ov);
  for (const t of CAT.tracks) chip('f-fixed', filters.fixed, t.id, `${trackIcon(t)}${t.name.replace(/^Ring /, '').replace(/^Wheel /, '')}`, true);
  for (const r of CAT.rollers) chip('f-roller', filters.roller, r.id, `${rollerIcon(r, 0)}${r.name.replace(/^Wheel /, '')}`, true);
  const maxHoles = Math.max(...CAT.rollers.map(r => r.holes.length));
  for (let k = 1; k <= maxHoles; k++) chip('f-hole', filters.hole, k, k);
  const ink = $('f-ink'), auto = document.createElement('button');
  auto.className = 'swatch on'; auto.title = 'Auto: one color per moving piece';
  auto.style.background = `conic-gradient(${INKS.join(',')},${INKS[0]})`;
  const picker = document.createElement('input'); picker.type = 'color'; picker.value = '#1f4fd8'; picker.title = 'Custom ink color';
  const setInk = (mode, el) => { inkMode = mode; ink.querySelectorAll('.swatch').forEach(s => s.classList.toggle('on', s === el)); repaintAll(); };
  auto.onclick = () => setInk('auto', auto); ink.append(auto);
  for (const c of INKS) {
    const s = document.createElement('button'); s.className = 'swatch'; s.style.background = c; s.title = c;
    s.onclick = () => { picker.value = c; setInk(c, s); }; ink.append(s);
  }
  picker.oninput = () => setInk(picker.value, null);
  ink.append(picker);
  $('paper').oninput = e => { document.documentElement.style.setProperty('--paper', e.target.value); scene.background.set(e.target.value); repaintAll(); };
}

function seededShuffle(arr, seed) {
  const a = arr.slice(); let s = seed >>> 0;
  const rnd = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function refilter() {
  const f = filters;
  list = ALL.filter(p =>
    (showOverlap || p.ok) &&
    (!f.mode.size || f.mode.has(p.track.inside ? 'in' : 'out')) &&
    (!f.fixed.size || f.fixed.has(p.track.id)) &&
    (!f.roller.size || f.roller.has(p.roller.id)) &&
    (!f.hole.size || f.hole.has(p.hole)));
  if (shuffled) list = seededShuffle(list, shuffled);
  const total = showOverlap ? ALL.length : okCount;
  $('count').textContent = `${list.length.toLocaleString()} of ${total.toLocaleString()} patterns` +
    (showOverlap ? '' : ` (${(ALL.length - okCount).toLocaleString()} overlapping hidden)`);
  layout(); window.scrollTo(0, 0); sync();
}
$('shuffle').onclick = () => { shuffled = (Math.random() * 2 ** 31) | 1; refilter(); };
$('reset').onclick = () => { shuffled = false; refilter(); };

// ---------------------------------------------------------------- rendering: offscreen WebGL -> tile canvases
const gl = new THREE.WebGLRenderer({ antialias: true });
gl.setPixelRatio(1);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#faf7f0');
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
camera.position.z = 1;
const mats = new Map();
let px = 0;                                     // tile size in device pixels
function material(color) {
  if (!mats.has(color)) mats.set(color, new LineMaterial({ color: new THREE.Color(color), linewidth: 1.3 * pr }));
  const m = mats.get(color); m.resolution.set(px, px); return m;
}
function paint(e) {
  const p = list[e.i], color = inkMode === 'auto' ? INKS[p.rollerIdx % INKS.length] : inkMode;
  const geo = new LineGeometry();
  geo.setPositions(trace(p.track.o, p.roller.o, p.track.inside, p.roller.holes[p.hole - 1]));
  const line = new Line2(geo, material(color));
  line.frustumCulled = false;
  scene.add(line); gl.render(scene, camera); scene.remove(line); geo.dispose();
  const c = e.canvas;
  if (c.width !== px) { c.width = px; c.height = px; }
  c.getContext('2d').drawImage(gl.domElement, 0, 0, px, px);
}
const pending = []; let pumping = false;
function pump() {                               // paint a few tiles per frame so scrolling stays smooth
  pumping = false;
  const t0 = performance.now();
  while (pending.length && performance.now() - t0 < BUDGET_MS) { const e = pending.shift(); if (e.alive) paint(e); }
  if (pending.length) { pumping = true; requestAnimationFrame(pump); }
}
function enqueue(e) { pending.push(e); if (!pumping) { pumping = true; requestAnimationFrame(pump); } }
const repaintAll = () => { for (const e of tiles.values()) enqueue(e); };

// ---------------------------------------------------------------- virtualized grid
const grid = $('grid');
const tiles = new Map();                        // list index -> { i, el, canvas, alive }
let cols = 1, tile = MIN_TILE, pitch = MIN_TILE + FOOT + GAP;

function dropTile(e) { e.alive = false; e.el.remove(); tiles.delete(e.i); }
function layout() {
  const w = grid.parentElement.clientWidth - 32;
  cols = Math.max(1, Math.floor((w + GAP) / (MIN_TILE + GAP)));
  tile = (w - GAP * (cols - 1)) / cols;
  pitch = tile + FOOT + GAP;
  px = Math.round(tile * pr);
  gl.setSize(px, px, false);
  grid.style.height = `${Math.max(0, Math.ceil(list.length / cols) * pitch - GAP)}px`;
  for (const e of [...tiles.values()]) dropTile(e);
}
function makeTile(i) {
  const p = list[i], row = Math.floor(i / cols), col = i % cols, el = document.createElement('div');
  el.className = 'tile';
  el.style.cssText = `left:${col * (tile + GAP)}px;top:${row * pitch}px;width:${tile}px;height:${tile + FOOT}px`;
  const canvas = document.createElement('canvas'); canvas.width = canvas.height = px;
  const foot = document.createElement('div'); foot.className = 'foot';
  foot.innerHTML = `${trackIcon(p.track)}${rollerIcon(p.roller, p.hole)}<div class="txt"><b>${p.track.name}</b> · ${p.track.inside ? 'inside' : 'outside'}<br>${p.roller.name} · hole ${p.hole}${p.ok ? '' : ' · <span style="color:#e0793a">overlaps</span>'}</div>`;
  el.append(canvas, foot); grid.append(el);
  const e = { i, el, canvas, alive: true }; tiles.set(i, e); enqueue(e);
}
function sync() {                               // create tiles near the viewport, discard the rest
  const top = grid.getBoundingClientRect().top, rows = Math.ceil(list.length / cols);
  const first = Math.max(0, Math.floor(-top / pitch) - 1), last = Math.min(rows - 1, Math.floor((innerHeight - top) / pitch) + 1);
  const from = first * cols, to = Math.min(list.length, (last + 1) * cols);
  for (const e of [...tiles.values()]) if (e.i < from || e.i >= to) dropTile(e);
  for (let i = from; i < to; i++) if (!tiles.has(i)) makeTile(i);
}
window.addEventListener('scroll', sync, { passive: true });
window.addEventListener('resize', () => { layout(); sync(); });

// ---------------------------------------------------------------- start
setTimeout(() => {                              // let "Preparing…" paint before the heavy enumeration
  const t0 = performance.now();
  CAT = buildCatalog(); ALL = CAT.combos; okCount = ALL.filter(p => p.ok).length;
  console.log(`catalog: ${okCount} of ${ALL.length} patterns fit, ${Math.round(performance.now() - t0)} ms`);
  buildFilters(); refilter();
}, 30);
</script>
</body>
</html>
